server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect /docs to /docs/ (docs live in dist/docs/ from Vite build)
    location = /docs {
        return 301 /docs/;
    }

    # Docs SPA fallback (Docusaurus client-side routing)
    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    # Redirect /blog to /blog/ (blog lives in dist/blog/ from Vite build)
    location = /blog {
        return 301 /blog/;
    }

    # Blog static files (Next.js static export)
    location /blog/ {
        try_files $uri $uri/ /blog/index.html;
    }

    # Dashboard SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
