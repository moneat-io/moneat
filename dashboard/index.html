<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Sentry-compatible error, performance, and session replay monitoring. Built for developers who care about reliability." />
    <link rel="canonical" href="https://moneat.io" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moneat | Error, Performance, and Replay Monitoring" />
    <meta property="og:description" content="Sentry-compatible error, performance, and session replay monitoring. Built for developers who care about reliability." />
    <meta property="og:url" content="https://moneat.io" />
    <meta property="og:image" content="https://moneat.io/og-image.png" />
    <meta property="og:site_name" content="Moneat" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moneat | Error, Performance, and Replay Monitoring" />
    <meta name="twitter:description" content="Sentry-compatible error, performance, and session replay monitoring. Built for developers who care about reliability." />
    <meta name="twitter:image" content="https://moneat.io/og-image.png" />
    <title>Moneat | Error, Performance, and Replay Monitoring</title>

    <script>
      // Apply theme immediately to prevent flash
      const theme = localStorage.getItem('theme') || 'dark';
      const root = document.documentElement;
      if (theme === 'dark') {
        root.classList.add('dark');
      } else if (theme === 'retro') {
        root.classList.add('theme-retro');
      } else if (theme === 'retro-dark') {
        root.classList.add('dark', 'theme-retro-dark');
      } else if (['midnight', 'forest', 'sunset', 'gamer'].includes(theme)) {
        root.classList.add('dark', 'theme-' + theme);
        if (theme === 'gamer') {
          var link = document.createElement('link');
          link.id = 'vt323-font';
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=VT323&display=swap';
          document.head.appendChild(link);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
