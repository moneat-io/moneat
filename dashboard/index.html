<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Moneat | Error, Performance, and Replay Monitoring</title>

    <script>
      // Apply theme immediately to prevent flash
      const theme = localStorage.getItem('theme') || 'light';
      const root = document.documentElement;
      if (theme === 'dark') {
        root.classList.add('dark');
      } else if (theme === 'retro') {
        root.classList.add('theme-retro');
      } else if (theme === 'retro-dark') {
        root.classList.add('dark', 'theme-retro-dark');
      } else if (['midnight', 'forest', 'sunset', 'gamer'].includes(theme)) {
        root.classList.add('dark', 'theme-' + theme);
        if (theme === 'gamer') {
          var link = document.createElement('link');
          link.id = 'vt323-font';
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=VT323&display=swap';
          document.head.appendChild(link);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
