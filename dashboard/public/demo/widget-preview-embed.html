<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widget Preview Embed</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(20, 184, 166, 0.18), transparent 46%),
          linear-gradient(315deg, rgba(59, 130, 246, 0.2), transparent 48%),
          #0f172a;
      }

      main {
        width: min(460px, calc(100vw - 32px));
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #67e8f9;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 34px);
        line-height: 1.08;
      }

      p {
        margin: 12px 0 0;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.55;
      }

      dl {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 22px 0 0;
      }

      div {
        border: 1px solid rgba(148, 163, 184, 0.26);
        border-radius: 8px;
        padding: 12px;
        background: rgba(15, 23, 42, 0.62);
      }

      dt {
        color: #94a3b8;
        font-size: 11px;
      }

      dd {
        margin: 5px 0 0;
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Embedded runbook</p>
      <h1>Checkout latency response</h1>
      <p>
        Triage request spikes, host saturation, and recent error streams from the surrounding dashboard widgets.
      </p>
      <dl>
        <div>
          <dt>Owner</dt>
          <dd>core</dd>
        </div>
        <div>
          <dt>SLO</dt>
          <dd>99.9%</dd>
        </div>
        <div>
          <dt>Stage</dt>
          <dd>demo</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
