<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 48" role="img" aria-label="Moneat">
  <defs>
    <linearGradient id="moneat-hb-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Integrated heartbeat-style "M" -->
  <polyline
    points="0,34 4,34 15,8 27,33 38,8 50,34 56,34"
    fill="none"
    stroke="url(#moneat-hb-grad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Remaining letters so the heartbeat acts as the first letter -->
  <text
    x="57"
    y="35"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="700"
    fill="currentColor"
    letter-spacing="-0.5"
  >
    oneat
  </text>
</svg>
