version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: moneat-postgres
    environment:
      # ⚠️ DEVELOPMENT ONLY — change all passwords before deploying to production
      POSTGRES_DB: moneat
      POSTGRES_USER: moneat
      POSTGRES_PASSWORD: moneat_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneat"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.1-alpine
    container_name: moneat-clickhouse
    environment:
      CLICKHOUSE_DB: moneat
      CLICKHOUSE_USER: moneat
      CLICKHOUSE_PASSWORD: moneat_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/src/main/resources/db/clickhouse_init.sql:/docker-entrypoint-initdb.d/clickhouse_init.sql
      - ./clickhouse-config/logging.xml:/etc/clickhouse-server/config.d/logging.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: moneat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: moneat-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/moneat
      DATABASE_USER: moneat
      DATABASE_PASSWORD: moneat_dev_password
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: moneat
      CLICKHOUSE_PASSWORD: moneat_dev_password
      REDIS_URL: redis://redis:6379
      # ⚠️ DEVELOPMENT ONLY — use a strong random secret in production
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8080
      STRIPE_ENABLED: "false"
      SELF_HOST: "true"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_BACKEND_URL: http://localhost:8080
    container_name: moneat-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  backend_storage:
