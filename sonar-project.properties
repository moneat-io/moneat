sonar.projectKey=moneat
sonar.projectName=moneat
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/kotlin,ee/backend/src/main/kotlin,dashboard/src
sonar.tests=backend/src/test/kotlin,backend/src/integrationTest/kotlin,ee/backend/src/test/kotlin,dashboard/src

sonar.test.inclusions=backend/src/test/kotlin/**/*,backend/src/integrationTest/kotlin/**/*,ee/backend/src/test/kotlin/**/*,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/src/**/*.spec.ts,dashboard/src/**/*.spec.tsx,dashboard/src/**/__tests__/**/*.ts,dashboard/src/**/__tests__/**/*.tsx
sonar.exclusions=dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/src/**/*.spec.ts,dashboard/src/**/*.spec.tsx,dashboard/src/**/__tests__/**/*.ts,dashboard/src/**/__tests__/**/*.tsx,dashboard/src/routeTree.gen.ts,dashboard/src/**/*.d.ts

sonar.java.binaries=backend/build/classes/kotlin/main,ee/backend/build/classes/kotlin/main
sonar.java.test.binaries=backend/build/classes/kotlin/test,ee/backend/build/classes/kotlin/test

sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=dashboard/coverage/lcov.info
sonar.kotlin.detekt.reportPaths=backend/build/reports/detekt/detekt.xml
sonar.typescript.tsconfigPaths=dashboard/tsconfig.json

# Framework wiring and blocking ingestion loops are integration-heavy; core metric behavior is covered separately.
sonar.coverage.exclusions=**/com/moneat/**/models/**,**/com/moneat/config/**,**/com/moneat/plugins/**,**/com/moneat/logging/**,**/com/moneat/enterprise/**,**/com/moneat/sso/**,**/com/moneat/Application*.kt,**/com/moneat/di/**,**/com/moneat/monitoring/MonitoringModule*.kt,**/*IngestionWorker*.kt,**/com/moneat/workflows/services/WorkflowExecutionWorker.kt,**/com/moneat/billing/services/BillingBackgroundService.kt,**/com/moneat/utils/WorkerQueueSupport.kt,backend/src/main/kotlin/com/moneat/monitor/services/ResourceCatalogQueryClient.kt,dashboard/src/routeTree.gen.ts,dashboard/src/components/monitoring/catalog/resourceCatalogData.ts
sonar.cpd.exclusions=dashboard/src/components/monitoring/catalog/resourceCatalogData.ts

# Ignore kotlin:S100 (function naming) in test files - Kotlin uses backtick test names
# Ignore kotlin:S1313 (hardcoded IP) in test files - fixtures use example IPs
# Ignore kotlin:S3776 in legacy Ktor route DSL registrars where Sonar counts nested handlers as one method.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e2.ruleKey=kotlin:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/integrationTest/**
sonar.issue.ignore.multicriteria.e3.ruleKey=kotlin:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e4.ruleKey=kotlin:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=**/src/integrationTest/**
sonar.issue.ignore.multicriteria.e5.ruleKey=kotlin:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=backend/src/main/kotlin/com/moneat/org/routes/AdminRoutes.kt
sonar.issue.ignore.multicriteria.e6.ruleKey=kotlin:S3776
sonar.issue.ignore.multicriteria.e6.resourceKey=backend/src/main/kotlin/com/moneat/org/routes/IntegrationRoutes.kt
