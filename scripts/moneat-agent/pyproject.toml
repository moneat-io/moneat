[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moneat-agent"
version = "0.1.0"
description = "Automated issue/PR fixer for the Moneat project"
requires-python = ">=3.11"

[project.scripts]
moneat-agent = "moneat_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
