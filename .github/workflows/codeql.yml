name: CodeQL

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}

      - name: Build Kotlin bytecode
        if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
        working-directory: backend
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx12g -Dorg.gradle.workers.max=1
        run: |
          ./gradlew classes --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx12g \
            -Dorg.gradle.workers.max=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.daemon.jvmargs=-Xmx12g \
            -Pkotlin.incremental=false

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

      - name: Prepare CodeQL PR guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          guard_path="${RUNNER_TEMP}/check-codeql-pr-alerts.py"

          if git cat-file -e "${BASE_SHA}:scripts/check-codeql-pr-alerts.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/check-codeql-pr-alerts.py" > "$guard_path"
          else
            cp scripts/check-codeql-pr-alerts.py "$guard_path"
          fi

          chmod +x "$guard_path"
          echo "CODEQL_PR_GUARD=$guard_path" >> "$GITHUB_ENV"

      - name: Fail on CodeQL alerts in changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          CODEQL_PR_GUARD_REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 "$CODEQL_PR_GUARD" \
            --sarif-dir "$SARIF_DIR" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA"
