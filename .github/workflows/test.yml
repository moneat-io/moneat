  # SonarQube: reuse backend and frontend artifacts, then scan Kotlin and dashboard sources
  sonarqube:
    name: SonarQube Analysis
    if: >-
      ${{
        always() &&
        github.event_name != 'schedule' &&
        (needs.backend-unit.result == 'success' || needs.backend-unit.result == 'skipped') &&
        (needs.backend-detekt.result == 'success' || needs.backend-detekt.result == 'skipped') &&
        (needs.frontend-unit.result == 'success' || needs.frontend-unit.result == 'skipped') &&
        (
          needs.backend-unit.result == 'success' ||
          needs.backend-detekt.result == 'success' ||
          needs.frontend-unit.result == 'success'
        )
      }}
    needs: [backend-unit, backend-detekt, frontend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
