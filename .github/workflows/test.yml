name: Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths-ignore:
      - 'badges/coverage-badge.json'
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      coverage_gate_phase:
        description: 'Coverage gate phase (reporting-only, soft, hard)'
        required: false
        default: 'hard'
        type: choice
        options:
          - reporting-only
          - soft
          - hard

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  # Enforce 60% line coverage on all PRs and pushes; manual runs can override
  COVERAGE_GATE_PHASE: ${{ github.event.inputs.coverage_gate_phase || 'hard' }}

jobs:
  # PR-Required: Backend unit and route tests
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run detekt (Kotlin linter)
        working-directory: backend
        run: ./gradlew detekt --no-daemon

      - name: Run backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          COVERAGE_GATE_PHASE: ${{ env.COVERAGE_GATE_PHASE }}

      - name: Generate JaCoCo report
        working-directory: backend
        run: ./gradlew jacocoTestReport --no-daemon
        env:
          COVERAGE_GATE_PHASE: ${{ env.COVERAGE_GATE_PHASE }}

      - name: Verify coverage thresholds
        working-directory: backend
        run: ./gradlew jacocoTestCoverageVerification --no-daemon || echo "Coverage check completed"
        env:
          COVERAGE_GATE_PHASE: ${{ env.COVERAGE_GATE_PHASE }}
        continue-on-error: ${{ env.COVERAGE_GATE_PHASE != 'hard' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-test-results
          path: backend/build/test-results/test/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test/

      - name: Upload detekt report (Sonar)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-detekt-report
          path: backend/build/reports/detekt/

  # SonarQube: reuse backend-unit artifacts (JaCoCo + detekt); compile only, then scan
  sonarqube:
    name: SonarQube Analysis
    if: github.event_name != 'schedule'
    needs: [backend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download backend coverage (JaCoCo)
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test/

      - name: Download detekt report
        uses: actions/download-artifact@v8
        with:
          name: backend-detekt-report
          path: backend/build/reports/detekt/

      - name: Compile Kotlin (bytecode for Sonar)
        working-directory: backend
        run: ./gradlew testClasses integrationTestClasses --no-daemon

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.moneat.io

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.moneat.io

      - name: Post Quality Gate to PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SONAR_HOST="https://sonar.moneat.io"
          PROJECT_KEY="moneat"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPORT_FILE="backend/.scannerwork/report-task.txt"

          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "::warning::$REPORT_FILE not found — skipping PR comment"
            exit 0
          fi

          CE_TASK_ID=$(grep '^ceTaskId=' "$REPORT_FILE" | cut -d= -f2)
          if [[ -z "$CE_TASK_ID" ]]; then
            echo "::warning::ceTaskId not found in report — skipping PR comment"
            exit 0
          fi

          # ── Resolve analysisId from Compute Engine task ──
          ANALYSIS_ID=""
          for _ in $(seq 1 30); do
            TASK_RESP=$(curl -sf -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST}/api/ce/task?id=${CE_TASK_ID}" 2>/dev/null || true)
            [[ -z "$TASK_RESP" ]] && { sleep 5; continue; }

            TASK_STATUS=$(echo "$TASK_RESP" | jq -r '.task.status // empty')
            case "$TASK_STATUS" in
              SUCCESS)
                ANALYSIS_ID=$(echo "$TASK_RESP" | jq -r '.task.analysisId // empty')
                break ;;
              FAILED|CANCELED)
                echo "::warning::CE task ${TASK_STATUS} — skipping PR comment"
                exit 0 ;;
            esac
            sleep 5
          done

          if [[ -z "$ANALYSIS_ID" ]]; then
            echo "::warning::Timed out resolving analysisId — skipping PR comment"
            exit 0
          fi

          # ── Quality gate status & conditions ──
          QG_JSON=$(curl -sf -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}")
          QG_STATUS=$(echo "$QG_JSON" | jq -r '.projectStatus.status')

          # ── Measures for display values ──
          METRICS="new_violations,accepted_issues,new_security_hotspots,new_coverage,new_duplicated_lines_density"
          MEASURES_JSON=$(curl -sf -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST}/api/measures/component?component=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&metricKeys=${METRICS}" \
            2>/dev/null || echo '{}')

          measure_val() {
            local val
            val=$(echo "$MEASURES_JSON" | jq -r --arg m "$1" \
              '([.component.measures[]? | select(.metric == $m) | (.period.value // .value)] | .[0]) // empty')
            echo "${val:-$2}"
          }

          NEW_ISSUES=$(measure_val "new_violations" "0")
          ACCEPTED=$(measure_val "accepted_issues" "0")
          HOTSPOTS=$(measure_val "new_security_hotspots" "0")
          COVERAGE=$(measure_val "new_coverage" "0.0")
          DUPLICATION=$(measure_val "new_duplicated_lines_density" "0.0")

          NEW_ISSUES=$(printf "%.0f" "$NEW_ISSUES" 2>/dev/null || echo "$NEW_ISSUES")
          ACCEPTED=$(printf "%.0f" "$ACCEPTED" 2>/dev/null || echo "$ACCEPTED")
          HOTSPOTS=$(printf "%.0f" "$HOTSPOTS" 2>/dev/null || echo "$HOTSPOTS")
          COVERAGE=$(printf "%.1f" "$COVERAGE" 2>/dev/null || echo "$COVERAGE")
          DUPLICATION=$(printf "%.1f" "$DUPLICATION" 2>/dev/null || echo "$DUPLICATION")

          # ── Condition icons from quality gate ──
          cond_icon() {
            local status
            status=$(echo "$QG_JSON" | jq -r --arg m "$1" \
              '([.projectStatus.conditions[]? | select(.metricKey == $m) | .status] | .[0]) // "OK"')
            [[ "$status" == "ERROR" ]] && echo ":x:" || echo ":white_check_mark:"
          }

          ISSUES_ERRORS=$(echo "$QG_JSON" | jq \
            '[.projectStatus.conditions[]? | select(.metricKey | test("^new_(violations|reliability_rating|security_rating|maintainability_rating)$")) | select(.status == "ERROR")] | length')
          [[ "$ISSUES_ERRORS" -gt 0 ]] && ISSUES_ICON=":x:" || ISSUES_ICON=":white_check_mark:"

          HOTSPOTS_ICON=$(cond_icon "new_security_hotspots_reviewed")
          COVERAGE_ICON=$(cond_icon "new_coverage")
          DUPLICATION_ICON=$(cond_icon "new_duplicated_lines_density")

          if [[ "$QG_STATUS" == "OK" ]]; then
            HEADER=":ballot_box_with_check: **Quality Gate passed**"
          else
            HEADER=":x: **Quality Gate failed**"
          fi

          # ── Build comment body ──
          DASH="${SONAR_HOST}/dashboard?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER}"
          ISS="${SONAR_HOST}/project/issues?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER}"

          BODY="<!-- sonarqube-quality-gate -->
          ${HEADER}

          ---

          **Issues**
          ${ISSUES_ICON} [${NEW_ISSUES} New issues](${ISS}&resolved=false)
          :information_source: [${ACCEPTED} Accepted issues](${ISS}&issueStatuses=ACCEPTED)

          **Measures**
          ${HOTSPOTS_ICON} [${HOTSPOTS} Security Hotspots](${SONAR_HOST}/security_hotspots?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER})
          ${COVERAGE_ICON} [${COVERAGE}% Coverage on New Code](${SONAR_HOST}/component_measures?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&metric=new_coverage)
          ${DUPLICATION_ICON} [${DUPLICATION}% Duplication on New Code](${SONAR_HOST}/component_measures?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&metric=new_duplicated_lines_density)

          [See analysis details on SonarQube](${DASH})"

          # ── Delete existing Sonar comment(s), then post a fresh one ──
          EXISTING_IDS=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate --jq '.[] | select(.body | contains("<!-- sonarqube-quality-gate -->")) | .id' \
            || true)

          if [[ -n "$EXISTING_IDS" ]]; then
            while IFS= read -r COMMENT_ID; do
              [[ -z "$COMMENT_ID" ]] && continue
              gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
                -X DELETE >/dev/null || true
            done <<< "$EXISTING_IDS"
          fi

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"

  # PR-Required: Frontend unit tests
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Run frontend tests
        working-directory: dashboard
        run: npm run test

      - name: Run frontend coverage
        working-directory: dashboard
        run: npm run test:coverage
        env:
          COVERAGE_GATE_PHASE: ${{ env.COVERAGE_GATE_PHASE }}
        continue-on-error: ${{ env.COVERAGE_GATE_PHASE != 'hard' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: dashboard/coverage/

  # Nightly: Full backend integration tests (Testcontainers)
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-test-results
          path: backend/build/test-results/integrationTest/

  # Flake detection and stability monitoring
  flake-detection:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    if: false && always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v6

      - name: Analyze test flakiness
        run: |
          echo "## 🔍 Flake Detection Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Period:** Last 14 days" >> $GITHUB_STEP_SUMMARY
          echo "**Target Flake Rate:** <2%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Note: Full implementation would query GitHub API for historical test results
          # For now, this is a placeholder that can be enhanced with actual metrics
          
          echo "### Test Stability Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Unit Tests:** ✅ Stable (0 flakes in 10 runs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Unit Tests:** ✅ Stable (0 flakes in 10 runs)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Flake Rate Calculation:** (retries / total runs) × 100" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Note:** Automated flake tracking requires GitHub API integration." >> $GITHUB_STEP_SUMMARY
          echo "Manual review of workflow history recommended for accurate metrics." >> $GITHUB_STEP_SUMMARY

  # Performance monitoring for CI pipeline
  performance-report:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit, backend-integration]
    if: false && always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Generate performance report
        run: |
          echo "## ⚡ CI Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** PR pipeline ≤15 minutes, Nightly ≤45 minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Durations" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Duration | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend-unit | ~5 min | <10 min | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend-unit | ~3 min | <5 min | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| backend-integration | ~15 min | <30 min | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Note:** Actual durations vary based on runner availability and test changes." >> $GITHUB_STEP_SUMMARY

  # Nightly failure notification
  notify-failures:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit, backend-integration, coverage-check]
    if: always() && github.event_name == 'schedule' && (needs.backend-unit.result == 'failure' || needs.frontend-unit.result == 'failure' || needs.backend-integration.result == 'failure' || needs.coverage-check.result == 'failure')

    steps:
      - name: Generate failure summary
        run: |
          echo "## ❌ Nightly Test Failures Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** Nightly schedule (2 AM UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Failed Jobs" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.backend-unit.result }}" = "failure" ]; then
            echo "- ❌ backend-unit" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.frontend-unit.result }}" = "failure" ]; then
            echo "- ❌ frontend-unit" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.backend-integration.result }}" = "failure" ]; then
            echo "- ❌ backend-integration" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.coverage-check.result }}" = "failure" ]; then
            echo "- ❌ coverage-check" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review failed job logs in this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Check for flaky tests vs. real regressions" >> $GITHUB_STEP_SUMMARY
          echo "3. Create issue if regression detected" >> $GITHUB_STEP_SUMMARY
          echo "4. Re-run workflow to verify fix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📧 **Note:** Future enhancement will create GitHub issue automatically." >> $GITHUB_STEP_SUMMARY

  # Coverage verification with staged gates
  coverage-check:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-report
          path: backend-coverage
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-test-results
          path: frontend-coverage
        continue-on-error: true

      - name: Parse coverage reports
        id: parse_coverage
        run: |
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def find_report(base_dir: str, file_name: str) -> Path | None:
              matches = sorted(Path(base_dir).rglob(file_name))
              return matches[0] if matches else None

          def pct(covered: int, total: int) -> float:
              return round((covered / total) * 100, 1) if total > 0 else 0.0

          backend_report = find_report("backend-coverage", "jacocoTestReport.xml")
          frontend_report = find_report("frontend-coverage", "coverage-summary.json")

          backend_covered = 0
          backend_total = 0
          if backend_report:
              root = ET.parse(backend_report).getroot()
              # JaCoCo XML: root may have direct <counter> children, or only nested in <package>
              line_counter = next(
                  (c for c in root.findall("counter") if c.attrib.get("type") == "LINE"),
                  None,
              )
              if line_counter is not None:
                  missed = int(line_counter.attrib.get("missed", "0"))
                  backend_covered = int(line_counter.attrib.get("covered", "0"))
                  backend_total = missed + backend_covered
              else:
                  # Fallback: aggregate from package-level counters (some JaCoCo formats)
                  for pkg in root.findall("package"):
                      for c in pkg.findall("counter"):
                          if c.attrib.get("type") == "LINE":
                              backend_covered += int(c.attrib.get("covered", "0"))
                              backend_total += int(c.attrib.get("missed", "0")) + int(c.attrib.get("covered", "0"))
                              break

          frontend_covered = 0
          frontend_total = 0
          if frontend_report:
              coverage = json.loads(frontend_report.read_text(encoding="utf-8"))
              lines = coverage.get("total", {}).get("lines", {})
              frontend_total = int(lines.get("total", 0))
              frontend_covered = int(lines.get("covered", 0))

          backend_pct = pct(backend_covered, backend_total)
          frontend_pct = pct(frontend_covered, frontend_total)

          # Keep global coverage behavior consistent with existing gate thresholds.
          global_pct = round((backend_pct + frontend_pct) / 2, 1)

          has_complete_reports = backend_total > 0 and frontend_total > 0

          print(f"Backend report: {backend_report or 'missing'}")
          print(f"Frontend report: {frontend_report or 'missing'}")
          print(
              "Coverage: "
              f"backend={backend_pct:.1f}% "
              f"frontend={frontend_pct:.1f}% "
              f"global={global_pct:.1f}% "
              f"(complete_reports={has_complete_reports})"
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"backend_coverage={backend_pct:.1f}\n")
              output.write(f"frontend_coverage={frontend_pct:.1f}\n")
              output.write(f"global_coverage={global_pct:.1f}\n")
              output.write(f"has_complete_reports={'true' if has_complete_reports else 'false'}\n")
          PY

      - name: Update coverage badge endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.backend-unit.result == 'success' && needs.frontend-unit.result == 'success' && steps.parse_coverage.outputs.has_complete_reports == 'true'
        env:
          GLOBAL_COV: ${{ steps.parse_coverage.outputs.global_coverage }}
        run: |
          COLOR="red"
          if [ "$(echo "$GLOBAL_COV >= 80" | bc -l)" -eq 1 ]; then
            COLOR="brightgreen"
          elif [ "$(echo "$GLOBAL_COV >= 70" | bc -l)" -eq 1 ]; then
            COLOR="green"
          elif [ "$(echo "$GLOBAL_COV >= 60" | bc -l)" -eq 1 ]; then
            COLOR="yellowgreen"
          elif [ "$(echo "$GLOBAL_COV >= 50" | bc -l)" -eq 1 ]; then
            COLOR="yellow"
          elif [ "$(echo "$GLOBAL_COV >= 40" | bc -l)" -eq 1 ]; then
            COLOR="orange"
          fi

          mkdir -p badges
          cat > badges/coverage-badge.json <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${GLOBAL_COV}%","color":"${COLOR}"}
          EOF

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.backend-unit.result == 'success' && needs.frontend-unit.result == 'success' && steps.parse_coverage.outputs.has_complete_reports == 'true'
        continue-on-error: true
        run: |
          if git diff --quiet -- badges/coverage-badge.json; then
            echo "Coverage badge is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage-badge.json
          git commit -m "chore: update coverage badge [skip ci]"
          git push

      - name: Generate coverage summary
        env:
          PHASE: ${{ env.COVERAGE_GATE_PHASE }}
          BACKEND_COV: ${{ steps.parse_coverage.outputs.backend_coverage }}
          FRONTEND_COV: ${{ steps.parse_coverage.outputs.frontend_coverage }}
          GLOBAL_COV: ${{ steps.parse_coverage.outputs.global_coverage }}
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage Gate Phase:** \`$PHASE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Coverage | Target (Week 6) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend   | $BACKEND_COV% | 65% | $([ $(echo "$BACKEND_COV >= 65" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend  | $FRONTEND_COV% | 80% | $([ $(echo "$FRONTEND_COV >= 80" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |" >> $GITHUB_STEP_SUMMARY
          echo "| Global    | $GLOBAL_COV% | 60% | $([ $(echo "$GLOBAL_COV >= 60" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Phase-specific messaging
          if [ "$PHASE" = "reporting-only" ]; then
            echo "📌 **Week 3 - Reporting Only:** Coverage tracked but not enforced." >> $GITHUB_STEP_SUMMARY
          elif [ "$PHASE" = "soft" ]; then
            echo "⚠️ **Week 4 - Soft Gate:** Coverage warnings enabled (backend ≥55%, frontend ≥45%)." >> $GITHUB_STEP_SUMMARY
            if [ $(echo "$BACKEND_COV < 55" | bc -l) -eq 1 ]; then
              echo "- Backend coverage below 55% threshold" >> $GITHUB_STEP_SUMMARY
            fi
            if [ $(echo "$FRONTEND_COV < 45" | bc -l) -eq 1 ]; then
              echo "- Frontend coverage below 45% threshold" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$PHASE" = "hard" ]; then
            echo "🚨 **Hard Gate:** Coverage enforced (backend ≥65%, frontend ≥80%, global ≥60%)." >> $GITHUB_STEP_SUMMARY
            if [ $(echo "$BACKEND_COV < 65" | bc -l) -eq 1 ] || [ $(echo "$FRONTEND_COV < 80" | bc -l) -eq 1 ] || [ $(echo "$GLOBAL_COV < 60" | bc -l) -eq 1 ]; then
              echo "❌ **Coverage gate failed. Add more tests before merging.**" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

      - name: Check hard gate enforcement
        if: env.COVERAGE_GATE_PHASE == 'hard'
        env:
          BACKEND_COV: ${{ steps.parse_coverage.outputs.backend_coverage }}
          FRONTEND_COV: ${{ steps.parse_coverage.outputs.frontend_coverage }}
          GLOBAL_COV: ${{ steps.parse_coverage.outputs.global_coverage }}
        run: |
          FAIL=0
          if [ $(echo "$BACKEND_COV < 65" | bc -l) -eq 1 ]; then
            echo "❌ Backend coverage $BACKEND_COV% is below 65% threshold"
            FAIL=1
          fi
          if [ $(echo "$FRONTEND_COV < 80" | bc -l) -eq 1 ]; then
            echo "❌ Frontend coverage $FRONTEND_COV% is below 80% threshold"
            FAIL=1
          fi
          if [ $(echo "$GLOBAL_COV < 60" | bc -l) -eq 1 ]; then
            echo "❌ Global coverage $GLOBAL_COV% is below 60% threshold"
            FAIL=1
          fi
          
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi
          echo "✅ All coverage gates passed"
