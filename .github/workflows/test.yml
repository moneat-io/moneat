name: Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths-ignore:
      - 'badges/coverage-badge.json'
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      coverage_gate_phase:
        description: 'Coverage gate phase (reporting-only, soft, hard)'
        required: false
        default: 'hard'
        type: choice
        options:
          - reporting-only
          - soft
          - hard

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  # Enforce 60% line coverage on all PRs and pushes; manual runs can override
  COVERAGE_GATE_PHASE: ${{ github.event.inputs.coverage_gate_phase || 'hard' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}

    steps:
      - name: Classify test-relevant changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          if [ "$EVENT_NAME" != "pull_request" ]; then
            backend=true
            frontend=true
          elif ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > changed-files.txt; then
            echo "::warning::Unable to list PR files; running both unit suites."
            backend=true
            frontend=true
          else
            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/workflows/test.yml|.github/workflows/release.yml|.github/actions/*|sonar-project.properties)
                  backend=true
                  frontend=true
                  ;;
                .env.example|ESSENTIAL_ENV_VARS.md|docker-compose.yml|docker-compose.*.yml|scripts/*)
                  backend=true
                  frontend=true
                  ;;
                backend/*|ee/backend/*|clickhouse-config/*)
                  backend=true
                  ;;
                dashboard/*|packages/analytics/*)
                  frontend=true
                  ;;
              esac
            done < changed-files.txt
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"

          {
            echo "## Test change classification"
            echo ""
            echo "| Area | Run unit job |"
            echo "|------|--------------|"
            echo "| Backend | ${backend} |"
            echo "| Frontend | ${frontend} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # PR-Required: Migration version numbering against the target branch
  migration-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration versions
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${BASE_REF}" ]]; then
            auth_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --no-tags "${auth_remote}" "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            python3 scripts/check-migration-versions.py --base-ref "origin/${BASE_REF}"
          else
            python3 scripts/check-migration-versions.py
          fi

  # PR-Required: Backend unit and route tests
  backend-unit:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
