name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, dashboard]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-${{ matrix.component }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-${{ matrix.component }}:latest
          cache-from: type=gha,scope=moneat-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=moneat-${{ matrix.component }}
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/moneat
            git fetch --depth=1 origin ${{ github.sha }}
            git checkout --detach ${{ github.sha }}
            export IMAGE_TAG=${{ github.sha }}
            export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-backend
            export DASHBOARD_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-dashboard
            ./deploy/scripts/deploy.sh ${{ github.sha }}
        env:
          REGISTRY: ghcr.io
