name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-backend:latest
          cache-from: type=gha,scope=moneat-backend
          cache-to: type=gha,mode=max,scope=moneat-backend
          provenance: false

  build-and-push-dashboard:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-dashboard:latest
          build-args: |
            VITE_BACKEND_URL=https://api.moneat.io
            VITE_API_URL=https://api.moneat.io
          cache-from: type=gha,scope=moneat-dashboard
          cache-to: type=gha,mode=max,scope=moneat-dashboard
          provenance: false

  deploy:
    needs: [build-and-push-backend, build-and-push-dashboard]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/moneat
            git fetch --depth=1 origin ${{ github.sha }}
            git checkout --detach ${{ github.sha }}
            export IMAGE_TAG=${{ github.sha }}
            export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-backend
            export DASHBOARD_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-dashboard
            ./deploy/scripts/deploy.sh ${{ github.sha }}
        env:
          REGISTRY: ghcr.io
