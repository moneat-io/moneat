name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run detekt
        working-directory: backend
        run: ./gradlew detekt --no-daemon

      - name: Run backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: dashboard
        run: npm run test

  build-backend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up QEMU
        uses: docker/setup-qemu-action@a4bc6cde7eccda2bdcfac02ca3348c91290880bd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c8ad1c5d0f6f39c2bc446b807fa8ea2afadcddb6

      - name: Log in to GHCR
        uses: docker/login-action@c144859092e8e353f3e118b0b329679a62351c3e
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@4378dc6be7f72231dfe78ac7e0364a44f1c9f54b
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@b66d8774c665b789105b440514f0c97e6f19b06f
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MONEAT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-dashboard:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up QEMU
        uses: docker/setup-qemu-action@a4bc6cde7eccda2bdcfac02ca3348c91290880bd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c8ad1c5d0f6f39c2bc446b807fa8ea2afadcddb6

      - name: Log in to GHCR
        uses: docker/login-action@c144859092e8e353f3e118b0b329679a62351c3e
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@4378dc6be7f72231dfe78ac7e0364a44f1c9f54b
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/moneat-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long

      - name: Build and push dashboard image
        uses: docker/build-push-action@b66d8774c665b789105b440514f0c97e6f19b06f
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  release:
    needs: [build-backend, build-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Skip GitHub Release for prerelease
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          echo "Prerelease tag ${{ github.ref_name }} will build images but will not publish a GitHub Release."

      - name: Get previous stable tag
        if: ${{ !contains(github.ref_name, '-') }}
        id: prev-tag
        run: |
          PREV=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -v '\-' | grep -A1 "^${{ github.ref_name }}$" | tail -1)
          if [ -z "$PREV" ]; then
            echo "::error::Could not find previous stable release for ${{ github.ref_name }}"
            exit 1
          fi
          if [ "$PREV" = "${{ github.ref_name }}" ]; then
            echo "::error::No previous release found (this may be the first release)"
            exit 1
          fi
          echo "tag=$PREV" >> $GITHUB_OUTPUT

      - name: Generate changelog for stable release
        if: ${{ !contains(github.ref_name, '-') }}
        uses: orhun/git-cliff-action@07dda386992489f0a6151dee53f3a137713644de
        with:
          config: cliff.toml
          args: ${{ steps.prev-tag.outputs.tag }}..${{ github.ref_name }} --tag ${{ github.ref_name }} --strip header --ignore-tags v[0-9]+\.[0-9]+\.[0-9]+-.*
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@e798e6a1ede8d07b74ac4cdac6bdfa4cc1653907
        with:
          body_path: CHANGES.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ contains(github.ref_name, '-') && 'develop' || 'main' }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$TARGET_BRANCH"; then
            echo "::error::Tag ${{ github.ref_name }} does not point to a commit on $TARGET_BRANCH"
            exit 1
          fi

          echo "Validated ${{ github.ref_name }} against $TARGET_BRANCH"
