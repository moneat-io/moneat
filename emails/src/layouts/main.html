<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings xmlns:o="urn:schemas-microsoft-com:office:office">
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <style>
    td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: "Segoe UI", sans-serif; mso-line-height-rule: exactly;}
  </style>
  <![endif]-->
  <style>
    @tailwind components;
    @tailwind utilities;

    @media screen and (max-width: 600px) {
      .email-shell {
        width: calc(100vw - 24px) !important;
        max-width: calc(100vw - 24px) !important;
        min-width: 0 !important;
      }

      .email-pad {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
    }

    u + .body .gmail-blend-screen {
      background: #000000;
      mix-blend-mode: screen;
    }

    u + .body .gmail-blend-difference {
      background: #000000;
      mix-blend-mode: difference;
    }

    /* Reset for email clients */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; }

    /* Prevent rounding on iOS */
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }
  </style>
</head>

<body
  class="body m-0 p-0 w-full [-webkit-font-smoothing:antialiased]"
  style="
    margin: 0;
    padding: 0;
    width: 100%;
    background-color: #f5f5f5;
    word-break: normal;
    overflow-wrap: break-word;
  "
>
  <div role="article" aria-roledescription="email" aria-label="Notification from Moneat" lang="en">
    <table
      class="w-full"
      width="100%"
      style="
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      "
    >
      <tr>
        <td align="center" class="py-8" style="padding: 32px 12px; background-color: #f5f5f5;">
          <yield />
        </td>
      </tr>
    </table>
  </div>
</body>

</html>
