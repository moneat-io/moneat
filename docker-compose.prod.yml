# Production compose for DigitalOcean Droplet.
# Use: export IMAGE_TAG=<tag> && docker compose -f docker-compose.prod.yml up -d ...
# Database volumes are EXTERNAL - create them once and never remove. See DEPLOYMENT.md.

services:
  nginx:
    image: nginx:alpine
    container_name: moneat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - moneat

  certbot:
    image: certbot/certbot:latest
    container_name: moneat-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    networks:
      - moneat

  postgres:
    image: postgres:18-alpine
    container_name: moneat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneat
      POSTGRES_USER: moneat
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - moneat_postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moneat

  clickhouse:
    image: clickhouse/clickhouse-server:26.1-alpine
    container_name: moneat-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: moneat
      CLICKHOUSE_USER: moneat
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - moneat_clickhouse_data:/var/lib/clickhouse
      - ./backend/src/main/resources/db/clickhouse_init.sql:/docker-entrypoint-initdb.d/clickhouse_init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "-O", "-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moneat

  redis:
    image: redis:8-alpine
    container_name: moneat-redis
    restart: unless-stopped
    volumes:
      - moneat_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moneat

  backend-blue:
    image: ${BACKEND_IMAGE:-ghcr.io/moneat/backend}:${IMAGE_TAG:-latest}
    container_name: moneat-backend-blue
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/moneat
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moneat

  backend-green:
    image: ${BACKEND_IMAGE:-ghcr.io/moneat/backend}:${IMAGE_TAG:-latest}
    container_name: moneat-backend-green
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/moneat
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moneat

  dashboard-blue:
    image: ${DASHBOARD_IMAGE:-ghcr.io/moneat/dashboard}:${IMAGE_TAG:-latest}
    container_name: moneat-dashboard-blue
    networks:
      - moneat

  dashboard-green:
    image: ${DASHBOARD_IMAGE:-ghcr.io/moneat/dashboard}:${IMAGE_TAG:-latest}
    container_name: moneat-dashboard-green
    networks:
      - moneat

volumes:
  moneat_postgres_data:
    external: true
  moneat_clickhouse_data:
    external: true
  moneat_redis_data:
    external: true
  certbot_conf:
    external: true
  certbot_www:
    external: true

networks:
  moneat:
    driver: bridge
