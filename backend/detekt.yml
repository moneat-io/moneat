build:
  maxIssues: 0

comments:
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license-header.txt'
    licenseTemplateIsRegex: false

# Disable rules that have widespread pre-existing violations.
# These can be enabled incrementally as the codebase is cleaned up.
style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  MaxLineLength:
    active: false
  UseRequire:
    active: false
  UseCheckOrError:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  UnusedPrivateProperty:
    active: false
  UnusedPrivateMember:
    active: true

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false
  LargeClass:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: false
  SwallowedException:
    active: false

naming:
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    active: false
  VariableNaming:
    active: false

coroutines:
  active: true

performance:
  SpreadOperator:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: true

formatting:
  # Issue-299: kotlinx/java imports inserted before com.*; long catch chains on one line.
  # Re-enable and run IDE "Optimize Imports" + manual wrap when cleaning up.
  ImportOrdering:
    active: false
  ParameterListWrapping:
    active: false
  Wrapping:
    active: false
