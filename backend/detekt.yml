build:
  maxIssues: 0

comments:
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license-header.txt'
    licenseTemplateIsRegex: false

# Disable rules that have widespread pre-existing violations.
# These can be enabled incrementally as the codebase is cleaned up.
style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  UseRequire:
    active: false
  UseCheckOrError:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  UnusedPrivateProperty:
    active: false
  UnusedPrivateMember:
    active: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false
  LargeClass:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
  SwallowedException:
    active: false

naming:
  MatchingDeclarationName:
    active: true
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    active: true
    excludes:
      - '**/test/**'
      - '**/integrationTest/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  VariableNaming:
    active: false

coroutines:
  active: true

performance:
  SpreadOperator:
    active: false

empty-blocks:
  EmptyCatchBlock:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: false

formatting:
  ImportOrdering:
    active: false
