build:
  maxIssues: 0

comments:
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license-header.txt'
    licenseTemplateIsRegex: false

# Disable rules that have widespread pre-existing violations.
# These can be enabled incrementally as the codebase is cleaned up.
style:
  MagicNumber:
    active: true
    excludes:
      - '**/test/**'
      - '**/integrationTest/**'
      - '**/DemoDataReseeder.kt'
    ignorePropertyDeclaration: true
    ignoreEnums: true
    ignoreRanges: true
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    # Demo seed data: long literals are intentional.
    excludes:
      - '**/com/moneat/config/DemoReseedCore.kt'
      - '**/com/moneat/config/DemoReseedDatadog.kt'
  UseRequire:
    active: false
  UseCheckOrError:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  UnusedPrivateProperty:
    active: false
  UnusedPrivateMember:
    active: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false
  # Enforced (issue #296): flag types over threshold so large classes are split intentionally.
  # Threshold above default 600 while a few large production types are migrated incrementally.
  LargeClass:
    active: true
    threshold: 1700
    excludes:
      - '**/test/**'
      - '**/integrationTest/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
  SwallowedException:
    active: false

naming:
  MatchingDeclarationName:
    active: true
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    active: true
    excludes:
      - '**/test/**'
      - '**/integrationTest/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  VariableNaming:
    active: false

coroutines:
  active: true

performance:
  SpreadOperator:
    active: false

empty-blocks:
  EmptyCatchBlock:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: false

formatting:
  ImportOrdering:
    active: false
  # ktlint line-length; demo seed strings in DemoReseedCore exceed 120 chars by design.
  MaximumLineLength:
    excludes:
      - '**/com/moneat/config/DemoReseedCore.kt'
