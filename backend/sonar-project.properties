sonar.projectKey=moneat
sonar.projectName=moneat

sonar.sources=src/main/kotlin,../ee/backend/src/main/kotlin
sonar.tests=src/test/kotlin,src/integrationTest/kotlin,../ee/backend/src/test/kotlin

sonar.java.binaries=build/classes/kotlin/main,../ee/backend/build/classes/kotlin/main
sonar.java.test.binaries=build/classes/kotlin/test,../ee/backend/build/classes/kotlin/test

sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml
# Demo seed splits (issue #296 / LargeClass): declarative data, not unit-tested; excluded from coverage gate.
# Core SSO is integration-heavy and already excluded from the JaCoCo gate.
sonar.coverage.exclusions=**/com/moneat/config/DemoReseed*.kt,**/com/moneat/config/DemoDataReseeder.kt,**/com/moneat/sso/**
# Ignore kotlin:S100 (function naming) in test files — Kotlin uses backtick test names
# Ignore kotlin:S1313 (hardcoded IP) in test files — fixtures use example IPs
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e2.ruleKey=kotlin:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/integrationTest/**
sonar.issue.ignore.multicriteria.e3.ruleKey=kotlin:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e4.ruleKey=kotlin:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=**/src/integrationTest/**
