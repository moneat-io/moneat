ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.moneat.ApplicationKt.module ]
    }
}

database {
    postgres {
        url = "jdbc:postgresql://localhost:5499/moneat"
        url = ${?DATABASE_URL}
        driver = "org.postgresql.Driver"
        user = "moneat"
        user = ${?DATABASE_USER}
        password = "moneat_dev_password"
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 25
    }
    clickhouse {
        url = "http://localhost:8123"
        url = ${?CLICKHOUSE_URL}
        database = "moneat"
        user = "moneat"
        user = ${?CLICKHOUSE_USER}
        password = "moneat_dev_password"
        password = ${?CLICKHOUSE_PASSWORD}
    }
}

redis {
    url = "redis://localhost:6379"
    url = ${?REDIS_URL}
}

jwt {
    secret = "change-this-secret-in-production"
    secret = ${?JWT_SECRET}
    issuer = "moneat"
    audience = "moneat-users"
    realm = "Moneat API"
    expirationMs = 3600000
}

email {
    provider = "smtp"
    from = "no-reply@notifications.translatr.app"
    from = ${?EMAIL_FROM}
    frontendUrl = "https://moneat.io"
    frontendUrl = ${?FRONTEND_URL}
    smtp {
        host = "smtp.gmail.com"
        host = ${?SMTP_HOST}
        port = 587
        port = ${?SMTP_PORT}
        username = ${?SMTP_USERNAME}
        password = ${?SMTP_PASSWORD}
        auth = true
        auth = ${?SMTP_AUTH}
        starttls = true
        starttls = ${?SMTP_STARTTLS}
    }
}

stripe {
    secretKey = ${?STRIPE_SECRET_KEY}
    webhookSecret = ${?STRIPE_WEBHOOK_SECRET}
    publishableKey = ${?STRIPE_PUBLISHABLE_KEY}
    meterEventName = "moneat_overage_units"
    meterEventName = ${?STRIPE_METER_EVENT_NAME}
}

ingest {
    queueKey = "moneat:ingest:queue"
    queueKey = ${?INGEST_QUEUE_KEY}
    dlqKey = "moneat:ingest:dlq"
    dlqKey = ${?INGEST_DLQ_KEY}
    workerCount = 4
    workerCount = ${?INGEST_WORKER_COUNT}
}

logs {
    queueKey = "moneat:logs:queue"
    queueKey = ${?LOGS_QUEUE_KEY}
    dlqKey = "moneat:logs:dlq"
    dlqKey = ${?LOGS_DLQ_KEY}
    workerCount = 2
    workerCount = ${?LOGS_WORKER_COUNT}
}

billing {
    stripeEnabled = false
    stripeEnabled = ${?STRIPE_ENABLED}
    enforcementEnabled = false
    enforcementEnabled = ${?BILLING_ENFORCEMENT_ENABLED}
    backgroundJobsEnabled = true
    backgroundJobsEnabled = ${?BILLING_BACKGROUND_JOBS_ENABLED}
}

retention {
    backgroundJobsEnabled = true
    backgroundJobsEnabled = ${?RETENTION_BACKGROUND_JOBS_ENABLED}
    sweepIntervalSeconds = 3600
    sweepIntervalSeconds = ${?RETENTION_SWEEP_INTERVAL_SECONDS}
    idChunkSize = 500
    idChunkSize = ${?RETENTION_ID_CHUNK_SIZE}
}

testing {
    backgroundJobsEnabled = true
    backgroundJobsEnabled = ${?TESTING_BACKGROUND_JOBS_ENABLED}
    externalIntegrationsEnabled = true
    externalIntegrationsEnabled = ${?TESTING_EXTERNAL_INTEGRATIONS_ENABLED}
}

legal {
    termsVersion = "2026-02-08"
    termsVersion = ${?LEGAL_TERMS_VERSION}
    privacyVersion = "2026-02-08"
    privacyVersion = ${?LEGAL_PRIVACY_VERSION}
}

slack {
    enabled = true
    enabled = ${?SLACK_ENABLED}
    clientId = ${?SLACK_CLIENT_ID}
    clientSecret = ${?SLACK_CLIENT_SECRET}
    redirectUri = "https://api.moneat.io/v1/integrations/slack/oauth/callback"
    redirectUri = ${?SLACK_REDIRECT_URI}
}

discord {
    enabled = true
    enabled = ${?DISCORD_ENABLED}
    clientId = ${?DISCORD_CLIENT_ID}
    clientSecret = ${?DISCORD_CLIENT_SECRET}
    redirectUri = "https://api.moneat.io/v1/integrations/discord/oauth/callback"
    redirectUri = ${?DISCORD_REDIRECT_URI}
    botToken = ${?DISCORD_BOT_TOKEN}
}

ai {
    # OpenAI configuration (AI chat is available for admin users when API key is provided)
    openaiApiKey = ${?OPENAI_API_KEY}
    openaiModel = "gpt-4o-mini"
    openaiModel = ${?OPENAI_MODEL}
    openaiMaxTokens = 2048
    openaiMaxTokens = ${?OPENAI_MAX_TOKENS}
}
