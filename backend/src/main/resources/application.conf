ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.moneat.ApplicationKt.module ]
    }
}

database {
    postgres {
        url = "jdbc:postgresql://localhost:5432/moneat"
        url = ${?DATABASE_URL}
        driver = "org.postgresql.Driver"
        user = "moneat"
        user = ${?DATABASE_USER}
        password = "moneat_dev_password"
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 10
    }
    clickhouse {
        url = "http://localhost:8123"
        url = ${?CLICKHOUSE_URL}
        database = "moneat"
        user = "moneat"
        user = ${?CLICKHOUSE_USER}
        password = "moneat_dev_password"
        password = ${?CLICKHOUSE_PASSWORD}
    }
}

redis {
    url = "redis://localhost:6379"
    url = ${?REDIS_URL}
}

jwt {
    secret = "change-this-secret-in-production"
    secret = ${?JWT_SECRET}
    issuer = "moneat"
    audience = "moneat-users"
    realm = "Moneat API"
    expirationMs = 3600000
}
