ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ com.moneat.ApplicationKt.module ]
    }
}

database {
    postgres {
        url = "jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
        driver = "org.h2.Driver"
        user = "sa"
        password = ""
        maxPoolSize = 5
    }
    clickhouse {
        url = "http://localhost:8123"
        database = "test"
        user = "default"
        password = ""
    }
}

# Redis is not configured in test environment - will be skipped

jwt {
    secret = "test-secret-for-unit-tests"
    issuer = "moneat"
    audience = "moneat-users"
    realm = "Moneat API"
    expirationMs = 3600000
}

email {
    provider = "smtp"
    from = "test@moneat.io"
    frontendUrl = "http://localhost:5173"
    smtp {
        host = "localhost"
        port = 587
        username = ""
        password = ""
        auth = false
        starttls = false
    }
}

stripe {
    secretKey = ""
    webhookSecret = ""
    publishableKey = ""
}

billing {
    stripeEnabled = false
    enforcementEnabled = false
    backgroundJobsEnabled = false
}

backgroundJobs {
    enabled = false
}

retention {
    backgroundJobsEnabled = false
}

testing {
    backgroundJobsEnabled = false
    externalIntegrationsEnabled = false
}
